version: 2

# These tests replace the hand-written quality checks (qc = {...}) from Practice 10.
models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_sales
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: date_key
        tests:
          - not_null
          - relationships:            # no orphan dates
              arguments: {to: ref('dim_date'), field: date_key}
      - name: customer_id
        tests:
          - not_null
          - relationships:            # no orphan customers
              arguments: {to: ref('dim_customer'), field: customer_id}
      - name: product_id
        tests:
          - not_null
          - relationships:            # no orphan products
              arguments: {to: ref('dim_product'), field: product_id}

  # ---- Part E: analytic marts (the Practice 10 queries, now rebuilt and tested every run)

  - name: mart_sales_region_month
    description: "E1 - Sales per region per month (fact_sales joined to dim_customer and dim_date). One row per (ym, region)."
    columns:
      - name: ym
        description: "Month, YYYY-MM"
        tests: [not_null]
      - name: region
        description: "Customer region from dim_customer"
        tests: [not_null]
      - name: revenue
        tests: [not_null]

  - name: mart_top5_products_per_category
    description: "E2 - Top 5 products by revenue in each category, ranked with ROW_NUMBER() and filtered with QUALIFY."
    columns:
      - name: category
        tests: [not_null]
      - name: rank_in_category
        description: "1 = best-selling product in its category"
        tests:
          - not_null
          - accepted_values:          # QUALIFY must keep ranks 1-5 only
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: product_id
        tests:
          - unique                    # a product belongs to one category, so it appears once
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}

  - name: mart_revenue_growth
    description: "E3 - Total revenue per month and month-over-month growth using LAG(). The first month has NULL growth."
    columns:
      - name: ym
        tests: [unique, not_null]
      - name: revenue
        tests: [not_null]
      - name: growth_pct
        description: "(revenue - previous month) / previous month * 100, rounded to 2 decimals"
